<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>骑行码表</title>
<link rel="stylesheet" href="css/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map">
  <div class="map-status" id="map-status" hidden></div>
  <button id="btn-loc" title="定位到当前位置" aria-label="定位到当前位置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>
</div>

<div id="dash">
  <div class="cell span-2"><span class="label">实时速度</span><span class="value" id="v-speed">0.0<span class="unit"> km/h</span></span></div>
  <div class="cell"><span class="label">平均速度</span><span class="value" id="v-avg">0.0<span class="unit"> km/h</span></span></div>
  <div class="cell"><span class="label">距离</span><span class="value" id="v-dist">0.00<span class="unit"> km</span></span></div>
  <div class="cell"><span class="label">骑行时间</span><span class="value" id="v-time">00:00:00</span></div>
  <div class="cell disconnected" id="cell-hr"><span class="label">心率</span><span class="value" id="v-hr">--<span class="unit"> bpm</span></span></div>
</div>

<div id="controls">
  <button id="btn-start">开始</button>
  <button id="btn-end" disabled>结束</button>
  <button id="btn-full" title="全屏">⛶</button>
</div>

<div id="set-backdrop"></div>
<div id="set-panel">
  <div class="set-handle"></div>
  <div class="set-head"><span>设置</span><button id="set-close">✕</button></div>
  <div class="set-row">
    <span>屏幕常亮</span>
    <label class="switch"><input type="checkbox" id="set-wake"><i></i></label>
  </div>
  <div class="set-row">
    <span>主题</span>
    <div class="seg" id="set-theme">
      <button data-v="dark">黑夜</button><button data-v="light">白天</button>
    </div>
  </div>
  <div class="set-row">
    <span>速度单位</span>
    <div class="seg" id="set-unit">
      <button data-v="kmh">km/h</button><button data-v="mph">mph</button>
    </div>
  </div>
  <div class="set-row">
    <span>漂移过滤</span>
    <div class="seg" id="set-filter">
      <button data-v="loose">宽松</button><button data-v="std">标准</button><button data-v="strict">严格</button>
    </div>
  </div>
  <div class="set-row col">
    <div class="line">
      <span>自动暂停</span>
      <label class="switch"><input type="checkbox" id="set-ap"><i></i></label>
    </div>
    <div class="line small" id="set-ap-box">
      <span>低于 <input type="number" id="set-ap-below" min="0" max="20" step="0.5"> km/h 停表</span>
      <span>高于 <input type="number" id="set-ap-above" min="0" max="30" step="0.5"> km/h 开表</span>
    </div>
  </div>
  <div class="set-row action" id="set-clear">清除当前记录</div>
  <div class="set-ver">ride-dash v1.1 · 上滑仪表盘可打开此页 · 数据仅存本机</div>
</div>

<div id="export-panel">
  <div class="card">
    <h3>骑行已结束</h3>
    <p id="export-summary"></p>
    <div class="row">
      <button id="btn-gpx">导出 GPX</button>
      <button id="btn-close">关闭</button>
    </div>
  </div>
</div>


<script src="js/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
